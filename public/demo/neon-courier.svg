<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" role="img" aria-label="Neon Courier cyberpunk concept art">
  <defs>
    <linearGradient id="sky" x1="840" y1="0" x2="840" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070812"/>
      <stop offset=".48" stop-color="#141028"/>
      <stop offset="1" stop-color="#3C1235"/>
    </linearGradient>
    <linearGradient id="road" x1="840" y1="420" x2="840" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12101C"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4D9D"/><stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="signGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9AD5" stop-opacity=".9"/><stop offset="1" stop-color="#FF3D8B" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1B1B2B"/><stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(280 240) rotate(90) scale(320 240)">
      <stop stop-color="#FF3D8B" stop-opacity=".34"/><stop offset="1" stop-color="#FF3D8B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1320 300) rotate(90) scale(300 220)">
      <stop stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="windows" width="34" height="46" patternUnits="userSpaceOnUse">
      <rect width="34" height="46" fill="transparent"/>
      <rect x="5" y="6" width="5" height="8" fill="#F8B4FF" opacity=".42"/>
      <rect x="19" y="6" width="5" height="8" fill="#7DD3FC" opacity=".24"/>
      <rect x="5" y="25" width="5" height="8" fill="#FDE68A" opacity=".25"/>
      <rect x="19" y="25" width="5" height="8" fill="#F8B4FF" opacity=".3"/>
    </pattern>
    <pattern id="rain" width="28" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="4" y1="0" x2="4" y2="34" stroke="#E0F2FE" stroke-opacity=".16" stroke-width="1"/>
      <line x1="18" y1="36" x2="18" y2="64" stroke="#E0F2FE" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <clipPath id="frame"><rect width="1680" height="720"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1680" height="720" fill="url(#sky)"/>
    <rect width="1680" height="720" fill="url(#glowA)"/>
    <rect width="1680" height="720" fill="url(#glowB)"/>

    <g opacity=".5">
      <rect x="40" y="180" width="150" height="300" fill="#0B0B17"/>
      <rect x="215" y="120" width="100" height="360" fill="#0E0C1B"/>
      <rect x="340" y="230" width="180" height="250" fill="#0A0914"/>
      <rect x="545" y="150" width="125" height="330" fill="#0C0A18"/>
      <rect x="1210" y="190" width="150" height="290" fill="#0A0914"/>
      <rect x="1390" y="120" width="120" height="360" fill="#0D0B19"/>
      <rect x="1540" y="215" width="160" height="265" fill="#08070F"/>
    </g>

    <g>
      <path d="M70 470V330H150V470H70Z" fill="#111124" stroke="#2D2340" stroke-width="1"/>
      <path d="M170 470V255H290V470H170Z" fill="#16122A" stroke="#3A2A50" stroke-width="1"/>
      <path d="M305 470V365H410V470H305Z" fill="#0F0D1E"/>
      <path d="M430 470V290H540V470H430Z" fill="#151329" stroke="#332746" stroke-width="1"/>
      <path d="M555 470V330H650V470H555Z" fill="#0E0C1B"/>
      <path d="M1180 470V300H1290V470H1180Z" fill="#131129" stroke="#2E2545" stroke-width="1"/>
      <path d="M1305 470V250H1400V470H1305Z" fill="#16132B" stroke="#392B52" stroke-width="1"/>
      <path d="M1420 470V350H1520V470H1420Z" fill="#0D0B19"/>
      <path d="M1540 470V280H1660V470H1540Z" fill="#121026"/>
      <rect x="170" y="255" width="120" height="215" fill="url(#windows)" opacity=".7"/>
      <rect x="430" y="290" width="110" height="180" fill="url(#windows)" opacity=".55"/>
      <rect x="1305" y="250" width="95" height="220" fill="url(#windows)" opacity=".5"/>
    </g>

    <g>
      <rect x="142" y="302" width="16" height="128" rx="8" fill="url(#neonPink)" filter="url(#soft2)"/>
      <rect x="142" y="302" width="16" height="128" rx="8" fill="#FCE7F3"/>
      <rect x="143" y="334" width="14" height="10" fill="#111124"/>
      <rect x="143" y="360" width="14" height="10" fill="#111124"/>
      <rect x="143" y="386" width="14" height="10" fill="#111124"/>
      <rect x="144" y="311" width="12" height="13" fill="#FF8AC8"/>

      <rect x="596" y="220" width="12" height="200" rx="6" fill="url(#neonCyan)" filter="url(#soft2)"/>
      <rect x="596" y="220" width="12" height="200" rx="6" fill="#CFFAFE"/>
      <rect x="597" y="250" width="10" height="16" fill="#0B1118"/>
      <rect x="597" y="284" width="10" height="16" fill="#0B1118"/>
      <rect x="597" y="318" width="10" height="16" fill="#0B1118"/>

      <rect x="1334" y="286" width="18" height="142" rx="9" fill="url(#neonPink)" filter="url(#soft2)"/>
      <rect x="1334" y="286" width="18" height="142" rx="9" fill="#FCE7F3"/>
      <rect x="1336" y="320" width="14" height="8" fill="#120E20"/>
      <rect x="1336" y="344" width="14" height="8" fill="#120E20"/>
      <rect x="1336" y="368" width="14" height="8" fill="#120E20"/>
    </g>

    <g opacity=".8">
      <path d="M0 470H1680" stroke="#FF77C8" stroke-opacity=".28" stroke-width="2"/>
      <rect y="470" width="1680" height="250" fill="url(#road)"/>
      <rect y="470" width="1680" height="250" fill="url(#glowA)" opacity=".6"/>
      <rect y="470" width="1680" height="250" fill="url(#rain)" opacity=".5"/>
      <path d="M120 470L20 720H300L245 470Z" fill="#FF4D9D" opacity=".08"/>
      <path d="M1020 470L860 720H1250L1160 470Z" fill="#22D3EE" opacity=".07"/>
      <path d="M1460 470L1390 720H1680L1600 470Z" fill="#FF4D9D" opacity=".08"/>
    </g>

    <g>
      <ellipse cx="1010" cy="594" rx="128" ry="13" fill="#020205" opacity=".65"/>
      <path d="M1010 408C987 408 971 424 969 446L955 556L984 560L1000 470L1016 560L1045 556L1032 446C1030 424 1033 408 1010 408Z" fill="url(#figure)"/>
      <path d="M1003 402C1003 384 1017 372 1033 372C1049 372 1062 385 1062 402C1062 418 1049 430 1033 430C1017 430 1003 418 1003 402Z" fill="#0B0B12"/>
      <path d="M949 392C980 361 1086 361 1117 392C1086 383 980 383 949 392Z" fill="#0C0C14"/>
      <path d="M949 392C963 372 1028 330 1092 371L1117 392C1068 365 990 365 949 392Z" fill="#171425" opacity=".95"/>
      <path d="M1033 430L1033 560" stroke="#E9D5FF" stroke-opacity=".12" stroke-width="2"/>
      <path d="M1035 424L1026 560" stroke="#FB7185" stroke-opacity=".4" stroke-width="2"/>
    </g>

    <g opacity=".5">
      <path d="M70 470L40 720H220L190 470Z" fill="url(#signGlow)" filter="url(#soft2)"/>
      <path d="M1290 470L1240 720H1440L1390 470Z" fill="#22D3EE" opacity=".18" filter="url(#soft2)"/>
    </g>

    <rect width="1680" height="720" fill="url(#rain)" opacity=".55"/>
    <rect width="1680" height="720" filter="url(#grain)" opacity=".32"/>
    <rect x="700" y="320" width="300" height="300" fill="url(#glowB)" opacity=".7"/>
    <rect width="1680" height="720" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="40"/>
  </g>
</svg>
