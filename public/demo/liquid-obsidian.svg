<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-label="Liquid obsidian perfume product shot">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".85">
      <stop stop-color="#191129"/><stop offset=".55" stop-color="#09070F"/><stop offset="1" stop-color="#030205"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#C4B5FD" stop-opacity=".32"/><stop offset=".55" stop-color="#7C3AED" stop-opacity=".1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E9D5FF"/><stop offset=".22" stop-color="#6D28D9"/><stop offset=".5" stop-color="#0F0A1A"/><stop offset=".74" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="bottle" x1="560" y1="300" x2="880" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2037"/><stop offset=".32" stop-color="#07060B"/><stop offset=".55" stop-color="#171022"/><stop offset=".8" stop-color="#050409"/><stop offset="1" stop-color="#1D1428"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F5F3FF" stop-opacity=".7"/><stop offset=".5" stop-color="#F5F3FF" stop-opacity="0"/><stop offset="1" stop-color="#F5F3FF" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D0B16"/><stop offset=".5" stop-color="#241A35"/><stop offset="1" stop-color="#09070F"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".3" r=".7">
      <stop stop-color="#7C3AED" stop-opacity=".5"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurSmall"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <clipPath id="frame"><rect width="1440" height="1080"/></clipPath>
  </defs>
