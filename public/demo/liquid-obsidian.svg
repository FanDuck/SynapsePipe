      <circle cx="398" cy="620" r="1.6" opacity=".5"/><circle cx="1060" cy="560" r="2.1" opacity=".7"/>
      <circle cx="560" cy="286" r="1.3" opacity=".5"/><circle cx="878" cy="250" r="2" opacity=".6"/>
      <circle cx="330" cy="780" r="1.7" opacity=".5"/><circle cx="1108" cy="760" r="1.4" opacity=".5"/>
    </g>
    <g fill="#E9D5FF">
      <circle cx="600" cy="540" r="1.2" opacity=".4"/><circle cx="860" cy="650" r="1.4" opacity=".4"/>
      <circle cx="520" cy="350" r="1" opacity=".3"/><circle cx="980" cy="470" r="1.2" opacity=".35"/>
