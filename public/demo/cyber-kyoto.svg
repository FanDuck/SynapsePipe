<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-label="Cyber Kyoto torii gates at night">
  <defs>
    <linearGradient id="sky" x1="450" y1="0" x2="450" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050818"/><stop offset=".4" stop-color="#101538"/><stop offset=".75" stop-color="#2A1745"/><stop offset="1" stop-color="#120B22"/>
    </linearGradient>
    <linearGradient id="ground" x1="450" y1="1020" x2="450" y2="1600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#150F22"/><stop offset=".5" stop-color="#0A0812"/><stop offset="1" stop-color="#030207"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7F1D1D"/><stop offset=".5" stop-color="#4C0F16"/><stop offset="1" stop-color="#25060C"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A5F3FC"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop stop-color="#FDF4FF" stop-opacity=".95"/><stop offset=".35" stop-color="#E9D5FF" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blurSmall"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <pattern id="rain" width="24" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
      <line x1="4" y1="0" x2="4" y2="28" stroke="#E0F2FE" stroke-opacity=".14" stroke-width="1"/>
      <line x1="16" y1="32" x2="16" y2="52" stroke="#E0F2FE" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="1600"/></clipPath>
    <g id="torii">
      <path d="M58 1580V330H142V1580Z" fill="url(#wood)" stroke="#A5F3FC" stroke-opacity=".18" stroke-width="2"/>
      <path d="M758 1580V330H842V1580Z" fill="url(#wood)" stroke="#A5F3FC" stroke-opacity=".18" stroke-width="2"/>
      <path d="M42 1580H158V1612H42ZM742 1580H858V1612H742Z" fill="#120710"/>
      <path d="M70 310H130M770 310H830" stroke="url(#neon)" stroke-width="5" stroke-opacity=".8"/>
      <path d="M10 250Q450 150 890 250L888 292Q450 196 12 292Z" fill="url(#wood)" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2.5"/>
      <path d="M88 340H812V382H88Z" fill="#3C0B12" stroke="url(#neon)" stroke-opacity=".5" stroke-width="2"/>
      <path d="M300 330V380M450 330V380M600 330V380" stroke="#A5F3FC" stroke-opacity=".25" stroke-width="3"/>
      <path d="M74 320V1580M126 320V1580M774 320V1580M826 320V1580" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2.4"/>
      <path d="M16 260Q450 162 884 260" fill="none" stroke="#A5F3FC" stroke-opacity=".7" stroke-width="2"/>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="1600" fill="url(#sky)"/>
    <circle cx="690" cy="260" r="120" fill="url(#moon)"/>
    <circle cx="690" cy="260" r="42" fill="#F5F3FF" opacity=".85"/>
    <g opacity=".5" fill="#C4B5FD">
      <circle cx="110" cy="130" r="1.4"/><circle cx="260" cy="230" r="1"/><circle cx="390" cy="90" r="1.6"/>
      <circle cx="540" cy="180" r=".9"/><circle cx="810" cy="120" r="1.2"/><circle cx="730" cy="480" r="1"/>
      <circle cx="170" cy="450" r="1.1"/><circle cx="320" cy="350" r=".8"/><circle cx="60" cy="640" r="1.2"/>
    </g>
    <g opacity=".35" fill="#7C3AED">
      <ellipse cx="220" cy="560" rx="260" ry="40" filter="url(#blur)"/>
      <ellipse cx="700" cy="620" rx="300" ry="50" filter="url(#blur)"/>
    </g>

    <g opacity=".2"><use href="#torii" transform="translate(450 660) scale(0.18) translate(-450 -660)"/></g>
    <g opacity=".32"><use href="#torii" transform="translate(450 660) scale(0.28) translate(-450 -660)"/></g>
    <g opacity=".48"><use href="#torii" transform="translate(450 660) scale(0.4) translate(-450 -660)"/></g>
    <g opacity=".66"><use href="#torii" transform="translate(450 660) scale(0.54) translate(-450 -660)"/></g>
    <g opacity=".85"><use href="#torii" transform="translate(450 660) scale(0.72) translate(-450 -660)"/></g>
    <use href="#torii"/>

    <g opacity=".55">
      <ellipse cx="450" cy="660" rx="180" ry="60" fill="url(#glow)" filter="url(#blur)"/>
      <path d="M0 1130H900V1600H0Z" fill="url(#ground)"/>
      <path d="M70 1170L260 1600H0V1280Z" fill="#22D3EE" opacity=".08"/>
      <path d="M832 1170L640 1600H900V1280Z" fill="#22D3EE" opacity=".08"/>
      <path d="M140 1170L340 1600H560L760 1170Z" fill="#67E8F9" opacity=".06"/>
      <path d="M212 1180V1460M688 1180V1460" stroke="#22D3EE" stroke-opacity=".22" stroke-width="8" filter="url(#blurSmall)"/>
    </g>

    <g>
      <ellipse cx="450" cy="1330" rx="150" ry="16" fill="#000" opacity=".6" filter="url(#blurSmall)"/>
      <path d="M450 1080C432 1080 420 1092 418 1110L404 1260L432 1266L444 1170L454 1266L482 1260L470 1110C468 1092 468 1080 450 1080Z" fill="#050409"/>
      <circle cx="450" cy="1058" r="26" fill="#08060C"/>
      <path d="M356 1050C398 1000 502 1000 544 1050C502 1036 398 1036 356 1050Z" fill="#0A0710"/>
      <path d="M356 1050C380 1018 420 990 450 990C480 990 520 1018 544 1050C500 1032 400 1032 356 1050Z" fill="#171024" opacity=".95"/>
      <path d="M450 1050V1150" stroke="#E9D5FF" stroke-opacity=".14" stroke-width="2"/>
      <path d="M336 1058L300 1120M564 1058L600 1120" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2"/>
    </g>

    <g>
      <rect x="188" y="930" width="34" height="120" rx="10" fill="#0B0714" stroke="#22D3EE" stroke-opacity=".3"/>
      <rect x="196" y="946" width="18" height="88" rx="6" fill="#22D3EE" opacity=".25"/>
      <rect x="678" y="870" width="34" height="140" rx="10" fill="#0B0714" stroke="#F472B6" stroke-opacity=".3"/>
      <rect x="686" y="888" width="18" height="104" rx="6" fill="#F472B6" opacity=".22"/>
    </g>

    <g fill="#67E8F9">
      <circle cx="240" cy="1120" r="2.2" opacity=".7"/><circle cx="310" cy="1210" r="1.6" opacity=".5"/>
      <circle cx="670" cy="1140" r="2" opacity=".6"/><circle cx="610" cy="1260" r="1.4" opacity=".4"/>
      <circle cx="160" cy="1000" r="1.8" opacity=".5"/><circle cx="770" cy="1050" r="1.6" opacity=".45"/>
    </g>
    <rect width="900" height="1600" fill="url(#rain)" opacity=".6"/>
    <rect width="900" height="1600" filter="url(#grain)" opacity=".32"/>
    <rect width="900" height="1600" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="26"/>
  </g>
</svg>
