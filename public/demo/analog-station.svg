    <rect x="0" y="0" width="1080" height="1440" fill="none" stroke="#0A0609" stroke-opacity=".45" stroke-width="60"/>
    <ellipse cx="540" cy="720" rx="760" ry="820" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="180" filter="url(#blur)"/>
  </g>
</svg>
