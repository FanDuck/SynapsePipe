<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Lunar greenhouse concept art">
  <defs>
    <radialGradient id="space" cx=".7" cy=".15" r="1.1">
      <stop stop-color="#12122E"/><stop offset=".55" stop-color="#06060F"/><stop offset="1" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="ground" x1="800" y1="610" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33333D"/><stop offset=".45" stop-color="#1A1A22"/><stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    <linearGradient id="dome" x1="360" y1="260" x2="1220" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FDBFF" stop-opacity=".28"/><stop offset=".45" stop-color="#4C7DFF" stop-opacity=".08"/><stop offset="1" stop-color="#B6E3FF" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="plant" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D8F7FF"/><stop offset="1" stop-color="#5B8FA8"/>
    </linearGradient>
    <radialGradient id="earth" cx=".35" cy=".32" r=".8">
      <stop stop-color="#9AD8FF"/><stop offset=".5" stop-color="#2D6CB5"/><stop offset="1" stop-color="#081A3B"/>
    </radialGradient>
    <radialGradient id="warm" cx=".5" cy=".8" r=".8">
      <stop stop-color="#FFD79A" stop-opacity=".9"/><stop offset=".5" stop-color="#FFB45E" stop-opacity=".26"/><stop offset="1" stop-color="#FFB45E" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blurSmall"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
