    </radialGradient>
    <radialGradient id="nebula2" cx=".5" cy=".5" r=".5">
      <stop stop-color="#22D3EE" stop-opacity=".4"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star" cx=".5" cy=".5" r=".5">
      <stop stop-color="#FDE68A" stop-opacity=".95"/><stop offset=".3" stop-color="#F59E0B" stop-opacity=".55"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
