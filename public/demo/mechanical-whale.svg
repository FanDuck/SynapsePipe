      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
